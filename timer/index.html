<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>발표·수업 타이머</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6fb;
      --band: #0b1f4b;
      --panel: #ffffff;
      --ink: #0b1630;
      --soft: #55607a;
      --line: #d5dbe8;
      --acc: #e0115f;
      --acc2: #fde7ef;
      --warn-bg: #fff4e5;
      --warn-line: #f59e0b;
      --warn-ink: #7c2d12;
      --danger-bg: #ffe4ec;
      --danger-line: #e0115f;
      --danger-ink: #880e39;
      --ok: #0b7a4b;
    }
    * { box-sizing: border-box; min-width: 0; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      transition: background-color 0.25s ease;
    }
    body.state-warn {
      background: var(--warn-bg);
    }
    body.state-danger {
      background: var(--danger-bg);
    }
    body.state-done {
      background: #ffe0ea;
    }
    .gut {
      padding-left: max(5vw, 16px);
      padding-right: max(5vw, 16px);
    }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
    }
    header {
      background: var(--band);
      color: #fff;
      padding: 24px 0;
    }
    header h1 {
      margin: 0 0 4px;
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0;
      color: #c4cde6;
      font-size: 15px;
    }
    main {
      padding: 26px 0 56px;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.95fr);
      gap: 22px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 28px -20px rgba(11, 31, 75, 0.35);
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }
    body.state-warn .panel.stage-panel {
      border-color: var(--warn-line);
      border-width: 2px;
    }
    body.state-danger .panel.stage-panel,
    body.state-done .panel.stage-panel {
      border-color: var(--danger-line);
      border-width: 2px;
    }
    .label-input {
      width: 100%;
      font: 700 18px "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      text-align: center;
    }
    .label-input:focus,
    .time-box input:focus,
    button:focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 2px;
    }
    .clock-box {
      text-align: center;
      padding: 28px 16px;
      border-radius: 16px;
      background: var(--bg);
      border: 1px solid var(--line);
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }
    body.state-warn .clock-box {
      background: #fef3c7;
      border-color: var(--warn-line);
      color: var(--warn-ink);
    }
    body.state-danger .clock-box {
      background: #ffd6e4;
      border-color: var(--danger-line);
      color: var(--danger-ink);
    }
    body.state-done .clock-box {
      background: #ffc2d6;
      border-color: var(--danger-line);
      color: var(--danger-ink);
    }
    .status-pill {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 99px;
      background: #e2e8f6;
      color: var(--band);
      margin-bottom: 10px;
    }
    body.state-warn .status-pill {
      background: #fde68a;
      color: #92400e;
    }
    body.state-danger .status-pill,
    body.state-done .status-pill {
      background: var(--acc);
      color: #fff;
    }
    .clock {
      font-size: clamp(58px, 11vw, 104px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }
    .progress-wrap {
      width: 100%;
      height: 10px;
      background: #e2e8f6;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 16px;
    }
    .progress-bar {
      height: 100%;
      width: 100%;
      background: var(--band);
      transition: width 0.2s linear, background-color 0.25s ease;
    }
    body.state-warn .progress-bar {
      background: #d97706;
    }
    body.state-danger .progress-bar,
    body.state-done .progress-bar {
      background: var(--acc);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      font: 700 16px "Noto Sans KR", sans-serif;
      border-radius: 12px;
      padding: 12px 20px;
      min-height: 48px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      border-color: var(--acc);
    }
    .btn.primary {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      min-width: 130px;
    }
    .btn.primary:hover {
      filter: brightness(1.07);
    }
    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
    }
    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .preset-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      font: 700 15px "Noto Sans KR", sans-serif;
      border-radius: 10px;
      padding: 10px 6px;
      cursor: pointer;
    }
    .preset-btn:hover,
    .preset-btn.active {
      background: var(--band);
      border-color: var(--band);
      color: #fff;
    }
    .custom-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }
    .time-box label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--soft);
      margin-bottom: 4px;
    }
    .time-box input {
      width: 100%;
      font: 700 20px "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: center;
    }
    .colon {
      font-size: 24px;
      font-weight: 900;
      color: var(--soft);
      padding-top: 20px;
    }
    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }
    .option-row select {
      font: 600 14px "Noto Sans KR", sans-serif;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
    }
    .hint {
      margin: 10px 0 0;
      font-size: 13px;
      color: var(--soft);
    }
    /* 종료 시 큰 안내 오버레이 */
    .done-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 22, 48, 0.78);
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 50;
    }
    .done-overlay[hidden] {
      display: none;
    }
    .done-card {
      width: 100%;
      max-width: 540px;
      background: #fff;
      color: var(--ink);
      border: 4px solid var(--acc);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      animation: popIn 0.22s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .done-badge {
      display: inline-block;
      background: var(--acc2);
      color: var(--acc);
      font-weight: 900;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 99px;
      margin-bottom: 12px;
    }
    .done-card h2 {
      margin: 0 0 10px;
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 900;
      color: var(--acc);
    }
    .done-card p {
      margin: 0 0 24px;
      font-size: 18px;
      color: var(--ink);
    }
    @media (max-width: 820px) {
      .grid {
        grid-template-columns: minmax(0, 1fr);
      }
      .presets {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap gut">
      <h1>발표·수업 타이머</h1>
      <p>발표 시간, 조별 활동, 수업 집중 시간을 깔끔하게 관리하세요.</p>
    </div>
  </header>

  <main>
    <div class="wrap gut">
      <div class="grid">
        <!-- 왼쪽: 큰 시계 및 시작/일시정지/초기화 -->
        <section class="panel stage-panel" aria-label="타이머 화면">
          <input
            type="text"
            class="label-input"
            id="sessionLabel"
            value="발표 및 조별 활동"
            aria-label="활동 제목"
            maxlength="40"
          >

          <div class="clock-box" id="clockBox">
            <div class="status-pill" id="statusPill">대기 중</div>
            <div class="clock" id="clock" aria-live="off">05:00</div>
            <div class="progress-wrap" aria-hidden="true">
              <div class="progress-bar" id="progressBar"></div>
            </div>
          </div>

          <div class="controls">
            <button type="button" class="btn primary" id="startBtn">시작</button>
            <button type="button" class="btn" id="pauseBtn" disabled>일시정지</button>
            <button type="button" class="btn" id="resetBtn">초기화</button>
            <button type="button" class="btn" id="soundTestBtn">알림음 테스트</button>
          </div>
          <p class="hint" id="liveHint" style="text-align:center;">
            남은 시간이 1분 이하가 되면 노란색, 10초 이하가 되면 빨간색 경고로 바뀝니다.
          </p>
        </section>

        <!-- 오른쪽: 프리셋 및 분·초 설정 -->
        <section class="panel" aria-label="시간 설정">
          <h2 class="section-title">빠른 시간 선택 (프리셋)</h2>
          <div class="presets">
            <button type="button" class="preset-btn" data-sec="60">1분</button>
            <button type="button" class="preset-btn" data-sec="180">3분</button>
            <button type="button" class="preset-btn active" data-sec="300">5분</button>
            <button type="button" class="preset-btn" data-sec="600">10분</button>
          </div>

          <h2 class="section-title">직접 시간 입력</h2>
          <div class="custom-row">
            <div class="time-box">
              <label for="minInput">분 (0~99)</label>
              <input type="number" id="minInput" min="0" max="99" value="5">
            </div>
            <div class="colon">:</div>
            <div class="time-box">
              <label for="secInput">초 (0~59)</label>
              <input type="number" id="secInput" min="0" max="59" value="0">
            </div>
          </div>
          <button type="button" class="btn" id="applyCustomBtn" style="width:100%;">입력한 시간 적용</button>

          <div class="option-row" style="margin-top:18px;">
            <label for="soundMode"><strong>종료 알림음</strong></label>
            <select id="soundMode">
              <option value="chime" selected>부드러운 차임벨</option>
              <option value="bell">또렷한 종소리</option>
              <option value="mute">소리 끄기</option>
            </select>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- 종료 시 큰 안내 화면 -->
  <div class="done-overlay" id="doneOverlay" role="dialog" aria-modal="true" aria-labelledby="doneTitle" hidden>
    <div class="done-card">
      <div class="done-badge">시간 종료</div>
      <h2 id="doneTitle">시간이 다 되었어요!</h2>
      <p id="doneDesc">설정한 시간이 종료되었습니다. 다음 순서로 진행해 주세요.</p>
      <div class="controls">
        <button type="button" class="btn primary" id="dismissDoneBtn">확인 및 닫기</button>
        <button type="button" class="btn" id="restartDoneBtn">같은 시간 다시 시작</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const $ = id => document.getElementById(id);

      let totalSeconds = 300;
      let remainingSeconds = 300;
      let timerId = null;
      let endAt = null;
      let audioCtx = null;

      function formatTime(sec) {
        const safe = Math.max(0, Math.ceil(sec));
        const m = Math.floor(safe / 60);
        const s = safe % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function updateVisualState(isFinished = false) {
        document.body.classList.remove('state-warn', 'state-danger', 'state-done');
        const pill = $('statusPill');

        if (isFinished || remainingSeconds <= 0) {
          document.body.classList.add('state-done');
          pill.textContent = '시간 종료';
        } else if (remainingSeconds <= 10) {
          document.body.classList.add('state-danger');
          pill.textContent = '마무리 10초 이내';
        } else if (remainingSeconds <= 60) {
          document.body.classList.add('state-warn');
          pill.textContent = '남은 시간 1분 이하';
        } else if (timerId) {
          pill.textContent = '진행 중';
        } else {
          pill.textContent = '대기 중';
        }

        $('clock').textContent = formatTime(remainingSeconds);
        document.title = `${formatTime(remainingSeconds)} · ${$('sessionLabel').value.trim() || '발표·수업 타이머'}`;

        const ratio = totalSeconds > 0 ? Math.max(0, Math.min(100, (remainingSeconds / totalSeconds) * 100)) : 0;
        $('progressBar').style.width = `${ratio}%`;
      }

      function syncInputsFromSeconds(sec) {
        $('minInput').value = Math.floor(sec / 60);
        $('secInput').value = sec % 60;
      }

      function highlightPreset(sec) {
        document.querySelectorAll('.preset-btn').forEach(btn => {
          btn.classList.toggle('active', Number(btn.dataset.sec) === sec);
        });
      }

      function playAlertSound(mode = $('soundMode').value) {
        if (mode === 'mute') return;
        try {
          if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }

          const now = audioCtx.currentTime;
          const notes = mode === 'bell' ? [880, 1174.66, 880, 1174.66] : [523.25, 659.25, 783.99, 1046.5];

          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = mode === 'bell' ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.22);

            gain.gain.setValueAtTime(0.001, now + idx * 0.22);
            gain.gain.exponentialRampToValueAtTime(0.22, now + idx * 0.22 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + idx * 0.22 + 0.45);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.22);
            osc.stop(now + idx * 0.22 + 0.48);
          });
        } catch (err) {
          // 오디오 차단 환경에서도 화면 안내는 정상 동작
        }
      }

      function openDoneModal() {
        const label = $('sessionLabel').value.trim() || '발표·수업 타이머';
        $('doneTitle').textContent = '시간이 다 되었어요!';
        $('doneDesc').textContent = `"${label}" 시간이 종료되었습니다.`;
        $('doneOverlay').hidden = false;
        updateVisualState(true);
        playAlertSound();
      }

      function closeDoneModal() {
        $('doneOverlay').hidden = true;
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        endAt = null;
        $('startBtn').disabled = false;
        $('pauseBtn').disabled = true;
      }

      function startTimer() {
        closeDoneModal();
        if (remainingSeconds <= 0) {
          remainingSeconds = totalSeconds > 0 ? totalSeconds : 60;
        }
        if (timerId) return;

        // 사용자 클릭 시점에 AudioContext 잠금 해제
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }

        endAt = Date.now() + remainingSeconds * 1000;
        $('startBtn').disabled = true;
        $('pauseBtn').disabled = false;
        updateVisualState(false);

        timerId = setInterval(() => {
          const left = Math.max(0, (endAt - Date.now()) / 1000);
          remainingSeconds = Math.ceil(left);
          updateVisualState(false);

          if (left <= 0) {
            remainingSeconds = 0;
            stopTimer();
            openDoneModal();
          }
        }, 150);
      }

      function resetTimer() {
        stopTimer();
        closeDoneModal();
        remainingSeconds = totalSeconds;
        updateVisualState(false);
      }

      function setDurationSeconds(sec) {
        stopTimer();
        closeDoneModal();
        totalSeconds = Math.max(1, Math.min(5999, sec));
        remainingSeconds = totalSeconds;
        syncInputsFromSeconds(totalSeconds);
        highlightPreset(totalSeconds);
        updateVisualState(false);
      }

      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          setDurationSeconds(Number(btn.dataset.sec));
        });
      });

      $('applyCustomBtn').addEventListener('click', () => {
        const mins = Math.max(0, Math.min(99, parseInt($('minInput').value, 10) || 0));
        const secs = Math.max(0, Math.min(59, parseInt($('secInput').value, 10) || 0));
        const combined = mins * 60 + secs;
        if (combined <= 0) {
          alert('1초 이상의 시간을 입력해 주세요.');
          return;
        }
        setDurationSeconds(combined);
      });

      $('startBtn').addEventListener('click', startTimer);
      $('pauseBtn').addEventListener('click', () => {
        stopTimer();
        updateVisualState(false);
      });
      $('resetBtn').addEventListener('click', resetTimer);
      $('soundTestBtn').addEventListener('click', () => playAlertSound());
      $('dismissDoneBtn').addEventListener('click', () => {
        closeDoneModal();
        updateVisualState(false);
      });
      $('restartDoneBtn').addEventListener('click', () => {
        remainingSeconds = totalSeconds;
        startTimer();
      });
      $('sessionLabel').addEventListener('input', () => updateVisualState(remainingSeconds === 0));

      updateVisualState(false);
    })();
  </script>
</body>
</html>
