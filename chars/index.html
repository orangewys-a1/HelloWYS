<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>글자 수·바이트 계산기 | 헬로WYS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f8fc;
      --panel: #ffffff;
      --band: #0b1f4b;
      --ink: #0b1630;
      --muted: #55607a;
      --line: #d5dbe8;
      --acc: #e0115f;
      --soft-acc: #fde7ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }
    header {
      background: var(--band);
      color: #fff;
      padding: 24px 20px;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #dbe4fa;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
    }
    .back-link:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }
    h1 {
      margin: 12px 0 4px;
      font-size: 26px;
      font-weight: 900;
    }
    header p {
      margin: 0;
      color: #c4cde6;
      font-size: 14px;
    }
    main {
      padding: 28px 20px 44px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 3px 10px -8px rgba(11, 31, 75, 0.2);
    }
    .stat-label {
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 900;
      color: var(--ink);
    }
    .stat-value.highlight {
      color: var(--acc);
    }
    .editor-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 6px 18px -12px rgba(11, 31, 75, 0.22);
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .sub-info {
      font-size: 13px;
      color: var(--muted);
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s ease;
    }
    button:hover {
      border-color: var(--band);
      background: #f4f6fb;
    }
    button.primary {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
    }
    button.primary:hover {
      opacity: 0.92;
    }
    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
