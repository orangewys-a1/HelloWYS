<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>글자 수·바이트 계산기 | 헬로WYS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f8fc;
      --panel: #ffffff;
      --band: #0b1f4b;
      --ink: #0b1630;
      --muted: #55607a;
      --line: #d5dbe8;
      --acc: #e0115f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }
    header {
      background: var(--band);
      color: #fff;
      padding: 24px 20px;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #dbe4fa;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
    }
    .back-link:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }
    h1 {
      margin: 12px 0 4px;
      font-size: 26px;
      font-weight: 900;
    }
    header p {
      margin: 0;
      color: #c4cde6;
      font-size: 14px;
    }
    main {
      padding: 28px 20px 44px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 3px 10px -8px rgba(11, 31, 75, 0.2);
    }
    .stat-label {
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 900;
      color: var(--ink);
    }
    .stat-value.highlight {
      color: var(--acc);
    }
    .editor-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 6px 18px -12px rgba(11, 31, 75, 0.22);
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .sub-info {
      font-size: 13px;
      color: var(--muted);
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s ease;
    }
    button:hover {
      border-color: var(--band);
      background: #f4f6fb;
    }
    button.primary {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
    }
    button.primary:hover {
      opacity: 0.92;
    }
    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      font-family: inherit;
      font-size: 15.5px;
      line-height: 1.7;
      color: var(--ink);
      outline: none;
    }
    textarea:focus {
      border-color: var(--band);
      box-shadow: 0 0 0 3px rgba(11, 31, 75, 0.1);
    }
    .toast {
      margin-top: 10px;
      min-height: 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--acc);
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="back-link" href="../">← 앱 모음으로 돌아가기</a>
      <h1>글자 수·바이트 계산기</h1>
      <p>공백 포함/제외 글자 수, 단어 수, 줄 수, 바이트 수를 실시간으로 확인하세요.</p>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="stats" aria-label="글자 수 통계">
        <div class="stat-card">
          <div class="stat-label">공백 포함</div>
          <div class="stat-value highlight" id="withSpace">0자</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">공백 제외</div>
          <div class="stat-value" id="withoutSpace">0자</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">단어 수</div>
          <div class="stat-value" id="wordCount">0개</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">줄 수</div>
          <div class="stat-value" id="lineCount">0줄</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">UTF-8 / 2바이트 기준</div>
          <div class="stat-value" id="byteCount" style="font-size: 17px;">0B / 0B</div>
        </div>
      </section>

      <section class="editor-box">
        <div class="toolbar">
          <span class="sub-info" id="manuscriptInfo">200자 원고지 약 0매</span>
          <div class="btn-group">
            <button type="button" id="sampleBtn">예시 넣기</button>
            <button type="button" id="clearBtn">지우기</button>
            <button type="button" class="primary" id="copyBtn">텍스트 복사</button>
          </div>
        </div>
        <textarea id="textInput" placeholder="여기에 글을 입력하거나 붙여넣으세요..."></textarea>
        <div class="toast" id="toastMsg"></div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      const textInput = document.getElementById("textInput");
      const withSpaceEl = document.getElementById("withSpace");
      const withoutSpaceEl = document.getElementById("withoutSpace");
      const wordCountEl = document.getElementById("wordCount");
      const lineCountEl = document.getElementById("lineCount");
      const byteCountEl = document.getElementById("byteCount");
      const manuscriptInfoEl = document.getElementById("manuscriptInfo");
      const toastMsgEl = document.getElementById("toastMsg");
      const encoder = new TextEncoder();
      let toastTimer = null;

      function getTwoByteLength(str) {
        let total = 0;
        for (const ch of str) {
          total += ch.charCodeAt(0) > 127 ? 2 : 1;
        }
        return total;
      }

      function showToast(msg) {
        toastMsgEl.textContent = msg;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastMsgEl.textContent = "";
        }, 2000);
      }

      function updateStats() {
        const text = textInput.value || "";
        const withSpace = Array.from(text).length;
        const noSpaceText = text.replace(/\s+/g, "");
        const withoutSpace = Array.from(noSpaceText).length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const lines = text.length ? text.split(/\r\n|\r|\n/).length : 0;
        const utf8Bytes = encoder.encode(text).length;
        const twoBytes = getTwoByteLength(text);
        const pages = (withSpace / 200).toFixed(1);

        withSpaceEl.textContent = `${withSpace.toLocaleString()}자`;
        withoutSpaceEl.textContent = `${withoutSpace.toLocaleString()}자`;
        wordCountEl.textContent = `${words.toLocaleString()}개`;
        lineCountEl.textContent = `${lines.toLocaleString()}줄`;
        byteCountEl.textContent = `${utf8Bytes.toLocaleString()}B / ${twoBytes.toLocaleString()}B`;
        manuscriptInfoEl.textContent = `200자 원고지 약 ${pages}매 (UTF-8 ${utf8Bytes.toLocaleString()}바이트 · 한글2B ${twoBytes.toLocaleString()}바이트)`;
      }

      textInput.addEventListener("input", updateStats);

      document.getElementById("sampleBtn").addEventListener("click", () => {
        textInput.value = "안녕하세요! 헬로WYS 글자 수 계산기입니다.\n공백 포함과 제외, 바이트 수를 바로 확인할 수 있어요.";
        updateStats();
        showToast("예시 문장을 불러왔습니다.");
      });

      document.getElementById("clearBtn").addEventListener("click", () => {
        textInput.value = "";
        updateStats();
        showToast("내용을 지웠습니다.");
      });

      document.getElementById("copyBtn").addEventListener("click", async () => {
        if (!textInput.value) {
          showToast("복사할 글자가 없습니다.");
          return;
        }
        try {
          await navigator.clipboard.writeText(textInput.value);
          showToast("클립보드에 복사되었습니다.");
        } catch {
          textInput.select();
          document.execCommand("copy");
          showToast("복사되었습니다.");
        }
      });

      updateStats();
    })();
  </script>
</body>
</html>
