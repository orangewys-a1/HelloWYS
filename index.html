<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>헬로WYS | 앱 모음</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --soft-bg: #f8fafc;
      --panel: #ffffff;
      --band: #0b1f4b;
      --ink: #0b1630;
      --muted: #55607a;
      --line: #d5dbe8;
      --acc: #e0115f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }
    /* 위쪽 곤색 바 영역에만 cloud.png 배경 적용 */
    header {
      position: relative;
      background-color: var(--band);
      background-image:
        linear-gradient(90deg, rgba(11, 31, 75, 0.88) 0%, rgba(11, 31, 75, 0.68) 60%, rgba(11, 31, 75, 0.82) 100%),
        url("./cloud.png");
      background-size: cover;
      background-position: center;
      color: #fff;
      padding: 34px 20px;
      border-bottom: 1px solid var(--line);
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }
    .profile-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
    }
    .profile-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.5);
      background: #1a3573;
      flex-shrink: 0;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 28px;
      font-weight: 900;
    }
    header p {
      margin: 0;
      color: #dbe4fa;
      font-size: 15px;
    }
    /* 하단 흰 배경 영역 */
    main {
      background: var(--bg);
      padding: 32px 20px 48px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 14px -10px rgba(11, 31, 75, 0.22);
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--acc);
      box-shadow: 0 12px 24px -14px rgba(11, 31, 75, 0.35);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--acc);
      background: #fde7ef;
      padding: 4px 10px;
      border-radius: 99px;
      margin-bottom: 12px;
      width: fit-content;
    }
    .card h2 {
      margin: 0 0 6px;
      font-size: 19px;
    }
    .card p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }
    .go {
      font-size: 14px;
      font-weight: 700;
      color: var(--acc);
    }

      background: var(--bg);
      border-top: 1px solid var(--line);

      color: var(--muted);
