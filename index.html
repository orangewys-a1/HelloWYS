<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelloWYS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: #f4f6f9;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 48px 20px;
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 36px;
    }

    /* 아바타 및 헤어 동그라미 컨테이너 */
    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .main-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      background-color: #fff;
    }

    /* 헤어 부분 동그라미 (avatar3.png & 이모지 전환 영역) */
    .hair-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #fff;
      border: 3px solid #ff9800;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .avatar-wrapper:hover .hair-badge {
      transform: scale(1.1) rotate(8deg);
    }

    .hair-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hair-badge .emoji-text {
      font-size: 24px;
      line-height: 1;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #666;
    }

    /* 프로젝트 메뉴 그리드 */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 720px;
    }

    .menu-card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .menu-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
    }

    .menu-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .menu-desc {
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>

  <header class="profile-header">
    <div class="avatar-wrapper" id="avatarContainer" title="클릭하여 헤어 아이콘 변경">
      <!-- 기본 아바타 이미지 -->
      <img src="./avatar.png" alt="HelloWYS 아바타" class="main-avatar" />
      
      <!-- 헤어 부분 동그라미: 초기값으로 avatar3.png 표시 -->
      <div class="hair-badge" id="hairBadge">
        <img src="./avatar3.png" alt="헤어 배지" />
      </div>
    </div>

    <h1>HelloWYS</h1>
    <p class="subtitle">아바타를 클릭하면 헤어 동그라미가 변경됩니다</p>
  </header>

  <main class="menu-grid">
    <a href="./chars/" class="menu-card">
      <span class="menu-title">📝 글자수 세기</span>
      <span class="menu-desc">공백 포함/제외 글자수 확인</span>
    </a>
    <a href="./qr/" class="menu-card">
      <span class="menu-title">📱 QR 만들기·읽기</span>
      <span class="menu-desc">QR 코드 생성 및 스캔</span>
    </a>
    <a href="./random/" class="menu-card">
      <span class="menu-title">🎲 랜덤 뽑기 / 팀 나누기</span>
      <span class="menu-desc">무작위 추첨 및 팀 배정</span>
    </a>
    <a href="./split/" class="menu-card">
      <span class="menu-title">🧮 더치페이 계산기</span>
      <span class="menu-desc">정산 및 금액 분할 계산</span>
    </a>
    <a href="./timer/" class="menu-card">
      <span class="menu-title">⏱️ 타이머</span>
      <span class="menu-desc">간편 웹 타이머</span>
    </a>
  </main>

  <script>
    const avatarContainer = document.getElementById('avatarContainer');
    const hairBadge = document.getElementById('hairBadge');

    // 헤어 동그라미에 순환 표시할 항목들 (avatar3.png 및 이모지)
    const badgeStates = [
      { type: 'image', src: './avatar3.png', alt: 'avatar3' },
      { type: 'emoji', value: '🍊' },
      { type: 'emoji', value: '✨' },
      { type: 'emoji', value: '💡' },
      { type: 'image', src: './avartar2.png', alt: 'avatar2' }
    ];

    let currentIndex = 0;

    avatarContainer.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % badgeStates.length;
      const current = badgeStates[currentIndex];

      if (current.type === 'image') {
        hairBadge.innerHTML = `<img src="${current.src}" alt="${current.alt}" />`;
      } else {
        hairBadge.innerHTML = `<span class="emoji-text">${current.value}</span>`;
      }
    });
  </script>

</body>
</html>
