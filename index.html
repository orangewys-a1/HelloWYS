<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>헬로WYS | 앱 모음</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: rgba(255, 255, 255, 0.92);
      --band: rgba(11, 31, 75, 0.86);
      --ink: #0b1630;
      --muted: #4b5670;
      --line: rgba(213, 219, 232, 0.9);
      --acc: #e0115f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
      background-color: var(--bg);
      /* 저장소의 cloud.png를 전체 페이지 배경으로 적용 */
      background-image:
        linear-gradient(180deg, rgba(244, 246, 251, 0.78) 0%, rgba(244, 246, 251, 0.88) 100%),
        url("./cloud.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    header {
      background: var(--band);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 32px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }
    .profile-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
    }
    .profile-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.45);
      background: #1a3573;
      flex-shrink: 0;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 28px;
      font-weight: 900;
    }
    header p {
      margin: 0;
      color: #d6dff5;
      font-size: 15px;
    }
    main {
      padding: 28px 20px 44px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: transform .1
