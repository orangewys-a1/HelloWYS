<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>랜덤 뽑기 & 팀 나누기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6fb;
      --band: #0b1f4b;
      --panel: #ffffff;
      --ink: #0b1630;
      --soft: #55607a;
      --line: #d5dbe8;
      --acc: #e0115f;
      --acc2: #fde7ef;
      --ok: #0b7a4b;
    }
    * { box-sizing: border-box; min-width: 0; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", system-ui, -apple-system, sans-serif;
      line-height: 1.5;
    }
    .gut {
      padding-left: max(5vw, 16px);
      padding-right: max(5vw, 16px);
    }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
    }
    header {
      background: var(--band);
      color: #fff;
      padding: 24px 0;
    }
    header h1 {
      margin: 0 0 4px;
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0;
      color: #c4cde6;
      font-size: 15px;
    }
    main {
      padding: 26px 0 56px;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      gap: 22px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 28px -20px rgba(11, 31, 75, 0.35);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab-btn {
      appearance: none;
      flex: 1;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      font: 700 15px "Noto Sans KR", sans-serif;
      padding: 11px 14px;
      border-radius: 12px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--band);
      border-color: var(--band);
      color: #fff;
    }
    .section-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 700;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--soft);
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      font: 500 15px/1.6 "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    textarea:focus,
    input:focus,
    button:focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 2px;
    }
    .opt-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--line);
      display: grid;
      gap: 12px;
    }
    .opt-inline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }
    .opt-inline input[type="number"] {
      width: 82px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      font: 700 15px "Noto Sans KR", sans-serif;
      text-align: center;
    }
    .check-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .check-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--acc);
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      font: 700 15px "Noto Sans KR", sans-serif;
      border-radius: 12px;
      padding: 12px 18px;
      min-height: 46px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      border-color: var(--acc);
    }
    .btn.primary {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      flex: 1;
    }
    .btn.primary:hover {
      filter: brightness(1.07);
    }
    .result-empty {
      padding: 44px 20px;
      text-align: center;
      color: var(--soft);
      border: 2px dashed var(--line);
      border-radius: 14px;
      background: var(--bg);
    }
    .picked-hero {
      text-align: center;
      padding: 28px 18px;
      border-radius: 16px;
      background: var(--acc2);
      border: 2px solid var(--acc);
      margin-bottom: 16px;
    }
    .picked-badge {
      display: inline-block;
      background: var(--acc);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 8px;
    }
    .picked-name {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 900;
      color: var(--ink);
      word-break: break-word;
    }
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .team-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }
    .team-title {
      font-weight: 900;
      color: var(--band);
      margin: 0 0 8px;
      font-size: 15px;
    }
    .team-list {
      margin: 0;
      padding-left: 18px;
      font-size: 14px;
    }
    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .chip {
      font-size: 13px;
      font-weight: 600;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 5px 12px;
    }
    .toast {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ok);
      min-height: 20px;
    }
    @media (max-width: 860px) {
      .grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap gut">
      <h1>랜덤 뽑기 &amp; 팀 나누기</h1>
      <p>발표 순서, 경품 추첨, 조별 편성을 한 화면에서 빠르게 진행하세요.</p>
    </div>
  </header>

  <main>
    <div class="wrap gut">
      <div class="grid">
        <!-- 왼쪽: 항목 입력 및 옵션 -->
        <section class="panel" aria-label="항목 입력">
          <div class="tabs" role="tablist">
            <button type="button" class="tab-btn active" id="tabPick" role="tab" aria-selected="true">랜덤 뽑기</button>
            <button type="button" class="tab-btn" id="tabTeam" role="tab" aria-selected="false">팀 나누기</button>
          </div>

          <div class="meta-row">
            <label for="itemsInput" class="section-title" style="margin:0;">항목 목록 (한 줄에 하나씩)</label>
            <span id="itemCount">0개 항목</span>
          </div>
          <textarea id="itemsInput" placeholder="예시:&#10;김민지&#10;이서준&#10;박지호&#10;최하은&#10;정다인&#10;한도윤"></textarea>

          <!-- 랜덤 뽑기 옵션 -->
          <div class="opt-box" id="pickOptions">
            <div class="opt-inline">
              <label for="pickCount"><strong>뽑을 수량</strong></label>
              <input type="number" id="pickCount" min="1" max="100" value="1">
            </div>
            <label class="check-label">
              <input type="checkbox" id="noRepeatCheck" checked>
              <span>이미 뽑힌 항목 중복 제외</span>
            </label>
          </div>

          <!-- 팀 나누기 옵션 -->
          <div class="opt-box" id="teamOptions" hidden>
            <div class="opt-inline">
              <label for="teamCount"><strong>나눌 팀 수</strong></label>
              <input type="number" id="teamCount" min="2" max="30" value="2">
              <span style="color:var(--soft); font-size:13px;">(인원을 골고루 섞어 배분합니다)</span>
            </div>
          </div>

          <div class="btn-row">
            <button type="button" class="btn primary" id="runBtn">추첨하기</button>
            <button type="button" class="btn" id="sampleBtn">예시 넣기</button>
            <button type="button" class="btn" id="clearBtn">지우기</button>
          </div>
        </section>

        <!-- 오른쪽: 결과 출력 -->
        <section class="panel" aria-label="결과 화면">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px;">
            <h2 class="section-title" style="margin:0; font-size:18px;">결과</h2>
            <button type="button" class="btn" id="copyResultBtn" style="min-height:38px; padding:8px 14px; font-size:13px;">결과 복사</button>
          </div>

          <div id="resultArea">
            <div class="result-empty">
              왼쪽에 이름이나 항목을 입력하고 <strong>추첨하기</strong>를 눌러 주세요.
            </div>
          </div>

          <div id="historyBox" style="margin-top:20px;" hidden>
            <div class="meta-row">
              <strong style="color:var(--ink);">이번 세션 뽑힌 기록</strong>
              <button type="button" id="resetPickedBtn" style="background:none; border:none; color:var(--acc); font-weight:700; cursor:pointer; font-size:13px;">뽑힌 기록 초기화</button>
            </div>
            <div class="history-list" id="historyChips"></div>
          </div>

          <div class="toast" id="toastMsg" role="status" aria-live="polite"></div>
        </section>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      let mode = 'pick'; // 'pick' | 'team'
      let pickedHistory = [];
      let lastResultText = '';

      const sampleNames = ['김민지', '이서준', '박지호', '최하은', '정다인', '한도윤', '윤채원', '강시우'];

      function getItems() {
        return $('itemsInput').value
          .split(/\r?\n/)
          .map(s => s.trim())
          .filter(Boolean);
      }

      function updateCount() {
        const count = getItems().length;
        $('itemCount').textContent = `${count}개 항목`;
      }

      function showToast(msg) {
        $('toastMsg').textContent = msg;
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => { $('toastMsg').textContent = ''; }, 2400);
      }

      function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function renderHistory() {
        if (!pickedHistory.length) {
          $('historyBox').hidden = true;
          $('historyChips').innerHTML = '';
          return;
        }
        $('historyBox').hidden = false;
        $('historyChips').innerHTML = pickedHistory
          .map((item, idx) => `<span class="chip">#${idx + 1} ${escapeHtml(item)}</span>`)
          .join('');
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function runPick() {
        const allItems = getItems();
        if (!allItems.length) {
          showToast('먼저 항목을 한 줄에 하나씩 입력해 주세요.');
          return;
        }

        const excludePicked = $('noRepeatCheck').checked;
        let pool = excludePicked
          ? allItems.filter(item => !pickedHistory.includes(item))
          : allItems.slice();

        if (!pool.length) {
          showToast('모든 항목이 이미 뽑혔습니다. "뽑힌 기록 초기화"를 눌러 주세요.');
          return;
        }

        const wanted = Math.max(1, Math.min(pool.length, parseInt($('pickCount').value, 10) || 1));
        const selected = shuffleArray(pool).slice(0, wanted);

        if (excludePicked) {
          pickedHistory = pickedHistory.concat(selected);
          renderHistory();
        }

        lastResultText = selected.map((name, i) => `${i + 1}. ${name}`).join('\n');

        if (selected.length === 1) {
          $('resultArea').innerHTML = `
            <div class="picked-hero">
              <div class="picked-badge">당첨 / 선택 결과</div>
              <div class="picked-name">${escapeHtml(selected[0])}</div>
            </div>
          `;
        } else {
          $('resultArea').innerHTML = `
            <div class="picked-hero">
              <div class="picked-badge">${selected.length}개 항목 선정</div>
              <div class="picked-name">${selected.map(escapeHtml).join(', ')}</div>
            </div>
          `;
        }
        showToast(`${selected.length}개 항목을 뽑았습니다.`);
      }

      function runTeam() {
        const allItems = getItems();
        if (allItems.length < 2) {
          showToast('팀을 나누려면 항목을 2개 이상 입력해 주세요.');
          return;
        }

        const teamCount = Math.max(2, Math.min(allItems.length, parseInt($('teamCount').value, 10) || 2));
        const shuffled = shuffleArray(allItems);
        const teams = Array.from({ length: teamCount }, () => []);

        shuffled.forEach((member, idx) => {
          teams[idx % teamCount].push(member);
        });

        lastResultText = teams
          .map((members, idx) => `[${idx + 1}팀] ${members.join(', ')}`)
          .join('\n');

        $('resultArea').innerHTML = `
          <div class="team-grid">
            ${teams.map((members, idx) => `
              <div class="team-card">
                <h3 class="team-title">${idx + 1}팀 (${members.length}명)</h3>
                <ol class="team-list">
                  ${members.map(m => `<li>${escapeHtml(m)}</li>`).join('')}
                </ol>
              </div>
            `).join('')}
          </div>
        `;
        showToast(`${teamCount}개 팀으로 나누었습니다.`);
      }

      function switchTab(nextMode) {
        mode = nextMode;
        const isPick = mode === 'pick';
        $('tabPick').classList.toggle('active', isPick);
        $('tabTeam').classList.toggle('active', !isPick);
        $('tabPick').setAttribute('aria-selected', String(isPick));
        $('tabTeam').setAttribute('aria-selected', String(!isPick));
        $('pickOptions').hidden = !isPick;
        $('teamOptions').hidden = isPick;
        $('runBtn').textContent = isPick ? '추첨하기' : '팀 나누기';
      }

      $('tabPick').addEventListener('click', () => switchTab('pick'));
      $('tabTeam').addEventListener('click', () => switchTab('team'));
      $('itemsInput').addEventListener('input', updateCount);

      $('runBtn').addEventListener('click', () => {
        if (mode === 'pick') runPick();
        else runTeam();
      });

      $('sampleBtn').addEventListener('click', () => {
        $('itemsInput').value = sampleNames.join('\n');
        updateCount();
        showToast('예시 명단을 넣었습니다.');
      });

      $('clearBtn').addEventListener('click', () => {
        $('itemsInput').value = '';
        updateCount();
      });

      $('resetPickedBtn').addEventListener('click', () => {
        pickedHistory = [];
        renderHistory();
        showToast('뽑힌 기록을 초기화했습니다.');
      });

      $('copyResultBtn').addEventListener('click', async () => {
        if (!lastResultText) {
          showToast('복사할 결과가 아직 없습니다.');
          return;
        }
        try {
          await navigator.clipboard.writeText(lastResultText);
          showToast('결과를 클립보드에 복사했습니다.');
        } catch {
          showToast('복사 권한을 확인해 주세요.');
        }
      });

      $('itemsInput').value = sampleNames.join('\n');
      updateCount();
    })();
  </script>
</body>
</html>
